<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario - MicroRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-5 py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-brand d-flex align-items-center gap-2" th:href="@{/}">
            <svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#ff385c" />
                <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="'Inter', sans-serif" font-weight="800" font-size="42">MR</text>
            </svg>
            <span>MicroRent</span>
        </a>
    </div>
</nav>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4" style="border-radius: 12px;">
                <h3 class="mb-4 fw-bold text-dark" th:text="${alojamiento.id == null ? 'Publicar nuevo espacio' : 'Editar espacio'}"></h3>
                <form th:action="@{/}" th:object="${alojamiento}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3"><label class="form-label fw-bold">Título</label><input type="text" th:field="*{titulo}" class="form-control bg-light border-0" required></div>
                    <div class="row mb-3">
                        <div class="col-md-6"><label class="form-label fw-bold">Ubicación</label><input type="text" th:field="*{ubicacion}" class="form-control bg-light border-0" required></div>
                        <div class="col-md-6"><label class="form-label fw-bold">Precio/noche (€)</label><input type="number" step="0.01" th:field="*{precioPorNoche}" class="form-control bg-light border-0" required></div>
                    </div>
                    <div class="mb-3"><label class="form-label fw-bold">Descripción</label><textarea th:field="*{descripcion}" class="form-control bg-light border-0" rows="4" required></textarea></div>
                    <div class="mb-3"><label class="form-label fw-bold">URL Foto Portada</label><input type="text" th:field="*{imagenPortada}" class="form-control bg-light border-0"></div>
                    <div class="mb-4"><label class="form-label fw-bold">URLs Galería (separadas por coma)</label><textarea th:field="*{imagenes}" class="form-control bg-light border-0" rows="2"></textarea></div>
                    <div class="d-flex justify-content-between mt-4">
                        <a th:href="@{/}" class="btn btn-outline-secondary px-4 fw-bold">Cancelar</a>
                        <button type="submit" class="btn btn-brand px-5 fw-bold" th:text="${alojamiento.id == null ? 'Publicar' : 'Actualizar'}"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
