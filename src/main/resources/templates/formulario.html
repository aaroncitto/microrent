<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario - MicroRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🏠 MicroRent</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 p-4">

                <h3 class="mb-4 text-primary" th:text="${alojamiento.id == null ? 'Publicar un nuevo alojamiento' : 'Editar alojamiento'}"></h3>

                <form th:action="@{/}" th:object="${alojamiento}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Título del anuncio</label>
                        <input type="text" th:field="*{titulo}" class="form-control" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ubicación (Ciudad)</label>
                            <input type="text" th:field="*{ubicacion}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Precio por noche (€)</label>
                            <input type="number" step="0.01" th:field="*{precioPorNoche}" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Descripción</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="4" required></textarea>
                    </div>

                    <div class="mb-4 bg-light p-3 border rounded">
                        <label class="form-label fw-bold text-primary">URL de la Foto de Portada</label>
                        <input type="text" th:field="*{imagenPortada}" class="form-control" placeholder="https://ejemplo.com/foto-principal.jpg">
                        <div class="form-text text-muted">
                            Esta será la imagen principal que verán los usuarios en la lista de búsqueda.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">URLs de las imágenes (Carrusel interior)</label>
                        <textarea th:field="*{imagenes}" class="form-control" rows="3" placeholder="https://url-foto1.jpg, https://url-foto2.jpg"></textarea>
                        <div class="form-text text-muted">
                            Para añadir varias fotos, pega las direcciones de internet separadas por una <b>coma</b>.
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success px-5" th:text="${alojamiento.id == null ? 'Guardar' : 'Actualizar'}"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
