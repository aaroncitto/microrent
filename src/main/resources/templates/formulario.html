<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MicroRent - Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 bg-white p-4 shadow rounded">
            <h2 class="mb-4 text-center" th:text="${alojamiento.id == null} ? 'Publicar Nuevo' : 'Editar Alojamiento'"></h2>

            <form th:action="@{/guardar}" th:object="${alojamiento}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Título</label>
                    <input type="text" th:field="*{titulo}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Ubicación</label>
                    <input type="text" th:field="*{ubicacion}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">URL de la Imagen</label>
                    <input type="url" th:field="*{imagenUrl}" class="form-control">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Precio / noche</label>
                        <input type="number" step="0.01" th:field="*{precioPorNoche}" class="form-control" required>
                    </div>
                    <div class="col-6 mb-3 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input type="checkbox" th:field="*{disponible}" class="form-check-input" id="disp">
                            <label class="form-check-label" for="disp">Disponible</label>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Guardar</button>
                    <a href="/" class="btn btn-link text-muted">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
