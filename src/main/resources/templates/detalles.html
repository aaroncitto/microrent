<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'MicroRent - ' + ${alojamiento.titulo}">Detalles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <a href="/" class="btn btn-link text-decoration-none mb-3">← Volver al listado</a>

            <div class="card shadow-sm border-0 overflow-hidden">
                <div class="row g-0">
                    <div class="col-md-6">
                        <img th:src="${alojamiento.imagenUrl != null && !alojamiento.imagenUrl.isEmpty()} ? ${alojamiento.imagenUrl} : 'https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=600&h=400'"
                             class="img-fluid h-100" alt="Foto" style="object-fit: cover; min-height: 400px;">
                    </div>

                    <div class="col-md-6 p-4 d-flex flex-column">
                        <div class="mb-auto">
                            <span th:if="${alojamiento.disponible}" class="badge bg-success mb-2">Disponible ahora</span>
                            <h1 class="display-5 fw-bold" th:text="${alojamiento.titulo}">Título</h1>
                            <p class="text-muted fs-5"><i class="bi bi-geo-alt"></i> <span th:text="${alojamiento.ubicacion}">Ubicación</span></p>
                            <hr>
                            <h4 class="fw-bold mt-4">Sobre este alojamiento</h4>
                            <p class="text-secondary lh-lg" th:text="${alojamiento.descripcion}">Descripción larga...</p>
                        </div>

                        <div class="mt-4 p-3 bg-light rounded d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted small d-block">Precio por noche</span>
                                <span class="h3 fw-bold text-primary" th:text="${alojamiento.precioPorNoche} + '€'"></span>
                            </div>
                            <button class="btn btn-primary btn-lg px-4">Reservar ahora</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
