<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles - MicroRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>.carousel-item img, .imagen-estatica { height: 450px; object-fit: cover; border-radius: 12px; }</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4 py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-brand d-flex align-items-center gap-2" th:href="@{/}">
            <svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#ff385c" />
                <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="'Inter', sans-serif" font-weight="800" font-size="42">MR</text>
            </svg>
            <span style="letter-spacing: -1px;">MicroRent</span>
        </a>
    </div>
</nav>

<div class="container mb-5 pb-5">
    <a th:href="@{/}" class="btn btn-link text-decoration-none text-secondary mb-3 px-0 fw-medium">← Volver al listado</a>

    <div class="row">
        <div class="col-lg-8">
            <h1 class="fw-bold mb-1" th:text="${alojamiento.titulo}"></h1>
            <p class="text-muted fs-5 mb-4" th:text="${alojamiento.ubicacion} + ' • Alojamiento entero'"></p>

            <div class="d-flex gap-2 mb-4">
                <a th:href="@{/editar/{id}(id=${alojamiento.id})}" class="btn btn-outline-secondary btn-sm fw-bold px-3 d-flex align-items-center gap-2">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    Editar
                </a>
                <form th:action="@{/borrar/{id}(id=${alojamiento.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm fw-bold px-3 d-flex align-items-center gap-2" onclick="return confirm('¿Seguro?');">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Borrar
                    </button>
                </form>
            </div>

            <!-- Galería con carrusel -->
            <div th:if="${alojamiento.imagenes != null and !alojamiento.imagenes.isEmpty()}" id="carouselMR" class="carousel slide shadow-sm mb-4" data-bs-ride="carousel">
                <div class="carousel-inner" style="border-radius: 12px;">
                    <div th:each="foto, iterStat : ${alojamiento.imagenes}" th:class="${iterStat.first} ? 'carousel-item active' : 'carousel-item'">
                        <img th:src="${foto}" class="d-block w-100">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselMR" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselMR" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
            </div>

            <div th:if="${(alojamiento.imagenes == null or alojamiento.imagenes.isEmpty()) and (alojamiento.imagenPortada != null and !alojamiento.imagenPortada.isEmpty())}" class="mb-4 shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <img th:src="${alojamiento.imagenPortada}" class="d-block w-100 imagen-estatica">
            </div>

            <div th:if="${(alojamiento.imagenes == null or alojamiento.imagenes.isEmpty()) and (alojamiento.imagenPortada == null or alojamiento.imagenPortada.isEmpty())}" class="bg-light text-center text-secondary shadow-sm mb-4 d-flex flex-column justify-content-center align-items-center" style="height: 450px; border-radius: 12px;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#dee2e6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-3"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                <h5 class="fw-bold">Sin fotografías</h5>
            </div>

            <h4 class="fw-bold mt-4 mb-3">Descripción</h4>
            <p class="fs-6" style="white-space: pre-wrap; line-height: 1.6;" th:text="${alojamiento.descripcion}"></p>
        </div>

        <div class="col-lg-4 mt-4 mt-lg-0">
            <div class="card shadow-sm border-0 p-4 sticky-top" style="top: 100px; border-radius: 12px;">
                <h3 class="fw-bold mb-3"><span th:text="${alojamiento.precioPorNoche}"></span>€ <small class="text-muted fw-normal fs-6">/ noche</small></h3>
                <button class="btn btn-brand btn-lg w-100 mt-3 fw-bold">Reservar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
