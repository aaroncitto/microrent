<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles - MicroRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item img, .imagen-estatica {
            height: 450px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">🏠 MicroRent</a></div>
</nav>

<div class="container mb-5">
    <a th:href="@{/}" class="btn btn-link text-decoration-none text-secondary mb-3">&larr; Volver al listado</a>

    <div class="row">
        <div class="col-lg-8">
            <h1 class="fw-bold" th:text="${alojamiento.titulo}">Título</h1>
            <p class="text-muted fs-5 mb-3" th:text="${alojamiento.ubicacion} + ' • Alojamiento entero'">Ubicación</p>

            <div class="d-flex gap-2 mb-4">
                <a th:href="@{/editar/{id}(id=${alojamiento.id})}" class="btn btn-warning btn-sm fw-bold">✏️ Editar Alojamiento</a>
                <form th:action="@{/borrar/{id}(id=${alojamiento.id})}" method="post" class="m-0">
                    <button type="submit" class="btn btn-danger btn-sm fw-bold" onclick="return confirm('Esta acción es irreversible. ¿Deseas borrarlo?');">🗑️ Borrar Alojamiento</button>
                </form>
            </div>

            <div th:if="${alojamiento.imagenes != null and !alojamiento.imagenes.isEmpty()}" id="carouselMicroRent" class="carousel slide shadow-sm mb-4" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div th:each="foto, iterStat : ${alojamiento.imagenes}" th:class="${iterStat.first} ? 'carousel-item active' : 'carousel-item'">
                        <img th:src="${foto}" class="d-block w-100" alt="Foto">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselMicroRent" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselMicroRent" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
            </div>

            <div th:if="${(alojamiento.imagenes == null or alojamiento.imagenes.isEmpty()) and (alojamiento.imagenPortada != null and !alojamiento.imagenPortada.isEmpty())}" class="mb-4 shadow-sm">
                <img th:src="${alojamiento.imagenPortada}" class="d-block w-100 imagen-estatica" alt="Foto de portada">
            </div>

            <div th:if="${(alojamiento.imagenes == null or alojamiento.imagenes.isEmpty()) and (alojamiento.imagenPortada == null or alojamiento.imagenPortada.isEmpty())}" class="bg-light text-center text-secondary shadow-sm rounded border mb-4 d-flex flex-column justify-content-center align-items-center" style="height: 450px;">
                <span style="font-size: 5rem;">📷</span>
                <h4 class="mt-3 text-muted">Alojamiento sin fotos</h4>
                <p class="mb-0">El anfitrión subirá imágenes próximamente.</p>
            </div>

            <h3 class="fw-bold mt-4">Acerca de este espacio</h3>
            <hr>
            <p class="lead fs-6" style="white-space: pre-wrap;" th:text="${alojamiento.descripcion}">Descripción...</p>
        </div>

        <div class="col-lg-4 mt-4 mt-lg-0">
            <div class="card shadow border-0 p-4 sticky-top" style="top: 20px;">
                <h3 class="fw-bold mb-3"><span th:text="${alojamiento.precioPorNoche}">0</span>€ <span class="fs-6 text-muted fw-normal">/ noche</span></h3>
                <button class="btn btn-primary btn-lg w-100 mt-3 fw-bold">Reservar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
