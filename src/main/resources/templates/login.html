<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - MicroRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>body { background-color: #f8f9fa; } .login-card { border-radius: 16px; border: none; }</style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <a class="text-decoration-none fw-bold fs-2 text-brand d-flex align-items-center justify-content-center gap-2" th:href="@{/login}">
                    <svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100" height="100" rx="22" fill="#ff385c" />
                        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="'Inter', sans-serif" font-weight="800" font-size="42">MR</text>
                    </svg>
                    <span style="letter-spacing: -1.5px;">MicroRent</span>
                </a>
            </div>

            <div class="card shadow-sm login-card p-4 p-md-5">
                <h3 class="fw-bold mb-4 text-center">Te damos la bienvenida</h3>

                <div th:if="${param.error}" class="alert alert-danger text-center small rounded-3 border-0 bg-danger bg-opacity-10 text-danger fw-medium">
                    Correo o contraseña incorrectos.
                </div>
                <div th:if="${param.exito}" class="alert alert-success text-center small rounded-3 border-0 bg-success bg-opacity-10 text-success fw-medium">
                    ¡Registro exitoso! Ya puedes iniciar sesión.
                </div>
                <div th:if="${param.logout}" class="alert alert-info text-center small rounded-3 border-0 bg-info bg-opacity-10 text-info fw-medium">
                    Has cerrado sesión correctamente.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Correo electrónico</label>
                        <input type="email" name="username" class="form-control form-control-lg bg-light border-0 fs-6" required placeholder="tu@email.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Contraseña</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light border-0 fs-6" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-brand btn-lg w-100 py-3 mb-3 rounded-pill">Continuar</button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted small">¿No tienes cuenta?</span>
                    <a th:href="@{/registro}" class="text-brand fw-bold text-decoration-none small">Regístrate</a>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
