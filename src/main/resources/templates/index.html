<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MicroRent - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🏠 MicroRent</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Alojamientos Disponibles</h2>
        <a th:href="@{/nuevo}" class="btn btn-success fw-bold">+ Nuevo Alojamiento</a>
    </div>

    <div th:if="${alojamientos.isEmpty()}" class="alert alert-warning text-center shadow-sm">
        Todavía no hay alojamientos publicados. ¡Sé el primero en crear uno!
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="acc : ${alojamientos}">
            <div class="card h-100 shadow-sm border-0">

                <img th:if="${acc.imagenPortada != null and !acc.imagenPortada.isEmpty()}"
                     th:src="${acc.imagenPortada}"
                     class="card-img-top" alt="Portada" style="height: 200px; object-fit: cover;">

                <div th:unless="${acc.imagenPortada != null and !acc.imagenPortada.isEmpty()}"
                     class="card-img-top bg-secondary bg-opacity-10 d-flex justify-content-center align-items-center" style="height: 200px;">
                    <span style="font-size: 3rem; color: #adb5bd;">🏠</span>
                </div>

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-truncate" th:text="${acc.titulo}">Título</h5>
                    <p class="card-text text-muted mb-2" th:text="${acc.ubicacion}">Ubicación</p>
                    <p class="card-text fs-4 fw-bold mt-auto"><span th:text="${acc.precioPorNoche}">0</span>€ <small class="text-muted fw-normal fs-6">/ noche</small></p>

                    <div class="d-flex gap-2 mt-3">
                        <a th:href="@{/{id}(id=${acc.id})}" class="btn btn-outline-primary w-100">Detalles</a>
                        <a th:href="@{/editar/{id}(id=${acc.id})}" class="btn btn-outline-warning" title="Editar">✏️</a>

                        <form th:action="@{/borrar/{id}(id=${acc.id})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger" title="Borrar" onclick="return confirm('¿Seguro que quieres borrar este alojamiento?');">🗑️</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
