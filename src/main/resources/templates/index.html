<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MicroRent - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        /* Un pequeño parche para que las fotos no se vean mal si fallan */
        .card-img-top { background-color: #e9ecef; min-height: 200px; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container mt-5 pt-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Alojamientos Disponibles</h1>
        <span class="badge bg-dark" th:text="${alojamientos.size()} + ' encontrados'"></span>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="alojamiento : ${alojamientos}">
            <div class="card h-100 shadow-sm border-0">
                <img th:src="${alojamiento.imagenUrl != null && !alojamiento.imagenUrl.isEmpty()} ? ${alojamiento.imagenUrl} : 'https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=400&h=250'"
                     class="card-img-top" alt="Alojamiento" style="height: 200px; object-fit: cover;">

                <div class="card-body">
                    <span th:if="${alojamiento.disponible}" class="badge bg-success mb-2">Disponible</span>
                    <span th:unless="${alojamiento.disponible}" class="badge bg-secondary mb-2">No disponible</span>

                    <h5 class="card-title fw-bold" th:text="${alojamiento.titulo}">Nombre</h5>
                    <p class="text-muted small" th:text="${alojamiento.ubicacion}">Ubicación</p>
                    <p class="fw-bold text-primary mb-3" th:text="${alojamiento.precioPorNoche} + '€ / noche'"></p>

                    <div class="d-flex gap-2">
                        <a th:href="@{/editar/{id}(id=${alojamiento.id})}"
                           class="btn btn-sm btn-warning text-white">Editar</a>
                        <a th:href="@{/detalles/{id}(id=${alojamiento.id})}" class="btn btn-sm btn-outline-primary">Ver detalles</a>
                        <a th:href="@{/eliminar/{id}(id=${alojamiento.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Borrar?')">Borrar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
